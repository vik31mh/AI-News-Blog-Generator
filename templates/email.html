<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>AI.NEWS</title>
<style>
  @media only screen and (max-width:620px) {
    .wrap { width:100% !important; }
    .pad { padding-left:18px !important; padding-right:18px !important; }
    .brand { font-size:28px !important; }
  }
</style>
</head>
<body style="margin:0;padding:0;background:#ffffff;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#ffffff;">
<tr><td align="center" style="padding:24px 12px;">
  <table role="presentation" class="wrap" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px;max-width:100%;border-top:3px solid #0a66c2;border-bottom:3px solid #0a66c2;background:#ffffff;">

    <!-- Header -->
    <tr><td class="pad" style="background:#eef5fd;padding:22px 24px 18px 24px;border-bottom:1px solid #0b2a55;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
        <tr>
          <td style="font-family:'Courier New',monospace;font-size:10px;letter-spacing:1.5px;color:#5b7fa6;text-transform:uppercase;">&#9679; AI News Digest</td>
          <td align="right" style="font-family:'Courier New',monospace;font-size:10px;letter-spacing:1.5px;color:#5b7fa6;text-transform:uppercase;">{{DATE}}</td>
        </tr>
      </table>
      <div style="border-top:1px solid #c5d8ee;margin:10px 0 14px 0;"></div>
      <div class="brand" style="font-family:Georgia,'Times New Roman',serif;font-size:34px;font-weight:bold;letter-spacing:-1px;color:#0b2a55;line-height:1.1;">AI.NEWS</div>
      <div style="font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:12px;color:#5b7fa6;margin-top:6px;">Your daily briefing on artificial intelligence &amp; technology</div>
    </td></tr>

    <!-- Section label -->
    <tr><td class="pad" style="padding:18px 24px 10px 24px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr>
        <td width="1" style="white-space:nowrap;font-family:'Courier New',monospace;font-size:10px;letter-spacing:1.5px;color:#5b7fa6;text-transform:uppercase;padding-right:10px;">Today's Briefing</td>
        <td style="border-top:1px solid #c5d8ee;">&nbsp;</td>
      </tr></table>
    </td></tr>

    <!-- Articles card -->
    <tr><td class="pad" style="padding:0 24px 24px 24px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#eef5fd;border:1px solid #c5d8ee;">
        <tr><td style="padding:6px 18px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
            {{ARTICLES}}
          </table>
        </td></tr>
      </table>
    </td></tr>

    <!-- Footer -->
    <tr><td class="pad" style="background:#eef5fd;padding:16px 24px;border-top:1px solid #c5d8ee;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"><tr>
        <td style="font-family:Georgia,'Times New Roman',serif;font-size:14px;font-weight:bold;letter-spacing:-0.5px;color:#0b2a55;">AI.NEWS</td>
        <td align="right" style="font-family:'Courier New',monospace;font-size:9px;letter-spacing:1px;color:#8aa5c4;text-transform:uppercase;line-height:1.5;">Automated via n8n &middot; AI<br>Stay informed. Stay ahead.</td>
      </tr></table>
    </td></tr>

  </table>
</td></tr>
</table>
</body>
</html>
